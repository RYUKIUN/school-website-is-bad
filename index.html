<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ค้นหาเกียรติบัตร</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  body{ font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  label{ display:block; margin-top: 12px; font-size: 14px; }
  input{ padding: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
  .year-inputs{ display:flex; gap: 8px; align-items:center; }
  .year-inputs input{ width: 100px; flex: none; }
  button{ margin-top: 16px; padding: 10px 20px; font-size: 14px; cursor: pointer; }
  button:disabled{ opacity: .5; cursor: not-allowed; }
  #progressWrap{ display:none; margin-top: 20px; }
  progress{ width: 100%; }
  #liveMatches{ font-size: 13px; color: #555; margin-top: 8px; }
  table{ width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td{ text-align: left; padding: 6px 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
  #resultsWrap{ display:none; }
  #downloadAllBtn{ margin-bottom: 10px; }
  .err{ color:#b00; font-size:13px; margin-top:10px; white-space:pre-wrap; }
</style>
</head>
<body>

<h2>ค้นหาเกียรติบัตร</h2>

<label>ชื่อ-นามสกุล (ไม่ต้องใส่คำนำหน้า)</label>
<input type="text" id="nameInput" placeholder="เช่น ณภัทร เจือจาน">

<label>ช่วงปี พ.ศ.</label>
<div class="year-inputs">
  <input type="number" id="yearStart" value="2567">
  <span>ถึง</span>
  <input type="number" id="yearEnd" value="2569">
</div>

<button id="searchBtn">ค้นหา</button>

<div id="progressWrap">
  <div id="progressText">กำลังเริ่มค้นหา...</div>
  <progress id="progressBar" value="0" max="100"></progress>
  <div id="liveMatches"></div>
</div>

<div id="errBox" class="err"></div>

<div id="resultsWrap">
  <h3 id="resultsCount"></h3>
  <button id="downloadAllBtn" disabled>ดาวน์โหลดทั้งหมด (ZIP)</button>
  <table id="resultsTable">
    <thead>
      <tr><th>ปี</th><th>กิจกรรม</th><th>ชื่อ</th><th></th></tr>
    </thead>
    <tbody id="resultsBody"></tbody>
  </table>
</div>

<script>
/* ====================================================================
   ตั้งค่า: ใส่ URL ของ Cloudflare Worker ที่ deploy แล้ว
   ตัวอย่าง: https://cert-proxy.yourname.workers.dev
   ==================================================================== */
const PROXY = "https://steep-cell-c60c.64sw1073.workers.dev";
/* ==================================================================== */

const BASE_URL = "http://110.164.93.228/cert/index.php";
const ACTIVITY_LIST_URL = "http://110.164.93.228/cert/index.php/certificate/model/project/toJSON";
const CONCURRENCY = 12;
const MATCH_THRESHOLD = 0.95;

const PREFIX_RE = /^(นาย|นาง|นางสาว|น\.ส\.|ด\.ช\.|ด\.ญ\.)\s*/;
const ZW_RE = /[​‌‍﻿]/g;
const ACTIVITY_TITLE_RE = /^\[([^\]]+)\]\s*(.*)$/;

const errBox = document.getElementById("errBox");
function showErr(msg){ errBox.textContent = msg; }

function cleanName(s){
  return (s || "").replace(ZW_RE, "").trim().replace(PREFIX_RE, "").replace(/\s+/g, " ").trim();
}

function bigrams(s){
  const clean = s.replace(/\s+/g, "");
  const out = [];
  for(let i=0;i<clean.length-1;i++) out.push(clean.slice(i,i+2));
  return out;
}

function diceCoefficient(a, b){
  const A = bigrams(a), B = bigrams(b);
  if(A.length === 0 || B.length === 0) return a === b ? 1 : 0;
  const bMap = {};
  for(const bg of B) bMap[bg] = (bMap[bg] || 0) + 1;
  let overlap = 0;
  for(const bg of A){ if(bMap[bg] > 0){ overlap++; bMap[bg]--; } }
  return (2 * overlap) / (A.length + B.length);
}

function sanitizeFilename(s){
  return s.replace(/[\\/:*?"<>|]/g, "_").replace(/\s+/g, " ").trim().slice(0, 140);
}

/* ทุก request ต้องผ่าน proxy: เว็บต้นทางเป็น http ล้วน (ไม่มี https เลย)
   ถ้ายิงตรงจากหน้า https เบราว์เซอร์จะบล็อกด้วย Mixed Content เสมอ */
function proxied(url){
  return PROXY.replace(/\/+$/, "") + "/?url=" + encodeURIComponent(url);
}

async function proxyFetch(url, options = {}, retries = 2){
  let lastErr;
  for(let attempt = 0; attempt <= retries; attempt++){
    try{
      const r = await fetch(proxied(url), options);
      if(r.ok) return await r.text();
      lastErr = new Error("HTTP " + r.status);
    }catch(e){ lastErr = e; }
    await new Promise(res => setTimeout(res, 400 * (attempt + 1)));
  }
  throw lastErr;
}

async function getActivities(year){
  const url = ACTIVITY_LIST_URL + "?" + Date.now();
  // ไม่ตั้ง header เอง เพื่อเลี่ยง CORS preflight — worker เติม Referer/Content-Type ให้ฝั่ง server แล้ว
  const text = await proxyFetch(url, { method: "POST", body: "year=" + year });

  let payload;
  try{ payload = JSON.parse(text); }
  catch(e){ console.warn("ปี " + year + ": ไม่ใช่ JSON", text.slice(0,200)); return []; }

  const certDict = payload.cert_id || {};
  const activities = [];
  for(const [key, value] of Object.entries(certDict)){
    if(key === "0") continue;
    const m = ACTIVITY_TITLE_RE.exec(value);
    if(m) activities.push({ year, certId: key, date: m[1], title: m[2] });
    else activities.push({ year, certId: key, date: "", title: value });
  }
  return activities;
}

function parseRows(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const rows = [];
  doc.querySelectorAll("tr").forEach(tr => {
    const link = tr.querySelector('a[href*="export.php"]');
    if(!link) return;
    const idMatch = link.getAttribute("href").match(/id=(\d+)/);
    if(!idMatch) return;
    let nameText = "";
    tr.querySelectorAll("td").forEach(td => {
      if(!nameText && /[฀-๿]/.test(td.textContent)) nameText = td.textContent.trim();
    });
    if(nameText) rows.push({ name: nameText, printId: idMatch[1] });
  });
  return rows;
}

function extractCertImage(html){
  const m = html.match(/data:image\/([a-zA-Z0-9.+-]+);base64,([A-Za-z0-9+/=\s]+)"/);
  if(!m) return null;
  const extRaw = m[1].toLowerCase();
  const extMap = { jpeg:"jpg", jpg:"jpg", png:"png", webp:"webp", gif:"gif" };
  const ext = extMap[extRaw] || extRaw;
  const b64 = m[2].replace(/\s+/g, "");
  return { dataUri: "data:image/" + extRaw + ";base64," + b64, base64: b64, ext };
}

async function runPool(tasks, worker, concurrency, onProgress){
  let idx = 0, done = 0;
  async function next(){
    while(idx < tasks.length){
      const myIdx = idx++;
      try{ await worker(tasks[myIdx]); }catch(e){}
      done++;
      if(onProgress) onProgress(done, tasks.length);
    }
  }
  const workers = Array.from({length: Math.min(concurrency, tasks.length)}, next);
  await Promise.all(workers);
}

const nameInput = document.getElementById("nameInput");
const yearStartInput = document.getElementById("yearStart");
const yearEndInput = document.getElementById("yearEnd");
const searchBtn = document.getElementById("searchBtn");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const liveMatchesEl = document.getElementById("liveMatches");
const resultsWrap = document.getElementById("resultsWrap");
const resultsCount = document.getElementById("resultsCount");
const resultsBody = document.getElementById("resultsBody");
const downloadAllBtn = document.getElementById("downloadAllBtn");

let allMatches = [];
let searching = false;

nameInput.addEventListener("keydown", (e) => { if(e.key === "Enter") startSearch(); });
searchBtn.addEventListener("click", startSearch);

async function startSearch(){
  if(searching) return;
  showErr("");
  if(PROXY.indexOf("REPLACE-ME") !== -1){
    showErr("ยังไม่ได้ตั้งค่า PROXY ในไฟล์ index.html (ใส่ URL ของ Cloudflare Worker ก่อน)");
    return;
  }
  const rawName = nameInput.value.trim();
  if(!rawName){ nameInput.focus(); return; }
  const targetName = cleanName(rawName);
  const yearStart = parseInt(yearStartInput.value, 10);
  const yearEnd = parseInt(yearEndInput.value, 10);
  if(!yearStart || !yearEnd || yearStart > yearEnd){
    alert("กรุณาใส่ช่วงปีให้ถูกต้อง");
    return;
  }

  searching = true;
  searchBtn.disabled = true;
  searchBtn.textContent = "กำลังค้นหา...";
  allMatches = [];
  resultsWrap.style.display = "none";
  resultsBody.innerHTML = "";
  liveMatchesEl.innerHTML = "";
  progressWrap.style.display = "block";
  progressBar.value = 0;
  progressText.textContent = "กำลังดึงรายชื่อกิจกรรมจริง...";

  const years = [];
  for(let y = yearStart; y <= yearEnd; y++) years.push(y);

  let allActivities = [];
  for(const y of years){
    progressText.textContent = "กำลังดึงรายชื่อกิจกรรมปี " + y + "...";
    try{
      allActivities = allActivities.concat(await getActivities(y));
    }catch(e){
      showErr("ดึงรายชื่อกิจกรรมไม่สำเร็จ: " + e.message + "\n(ตรวจว่า Worker ยัง online อยู่)");
    }
  }

  if(allActivities.length === 0){
    progressText.textContent = "ไม่พบรายชื่อกิจกรรมเลย";
    searching = false;
    searchBtn.disabled = false;
    searchBtn.textContent = "ค้นหา";
    return;
  }

  const seenChips = new Set();

  await runPool(allActivities, async (activity) => {
    const url = BASE_URL + "?count=100&year=" + activity.year + "&group_id=0&cert_id=" + activity.certId + "&sort=user_no&search=";
    const html = await proxyFetch(url);
    const rows = parseRows(html);
    for(const row of rows){
      const rowName = cleanName(row.name);
      const score = diceCoefficient(rowName, targetName);
      if(score >= MATCH_THRESHOLD){
        allMatches.push({ year: activity.year, activity: activity.title, date: activity.date, name: row.name, printId: row.printId, score });
        const chipKey = activity.year + "_" + row.printId;
        if(!seenChips.has(chipKey)){
          seenChips.add(chipKey);
          const div = document.createElement("div");
          div.textContent = "พบ: " + activity.year + " - " + activity.title;
          liveMatchesEl.appendChild(div);
        }
      }
    }
  }, CONCURRENCY, (done, total) => {
    progressBar.value = Math.round((done / total) * 100);
    progressText.textContent = "กำลังตรวจกิจกรรม... " + done + "/" + total;
  });

  finishSearch(targetName);
}

function finishSearch(targetName){
  searching = false;
  searchBtn.disabled = false;
  searchBtn.textContent = "ค้นหา";
  progressText.textContent = "ค้นหาเสร็จสิ้น";

  const byKey = new Map();
  for(const m of allMatches){
    const key = m.year + "_" + m.printId;
    if(!byKey.has(key) || byKey.get(key).score < m.score) byKey.set(key, m);
  }
  allMatches = Array.from(byKey.values()).sort((a,b) => a.year - b.year || b.score - a.score);

  resultsWrap.style.display = "block";
  resultsCount.textContent = "พบ " + allMatches.length + " ใบ สำหรับ \"" + targetName + "\"";

  if(allMatches.length === 0){
    downloadAllBtn.disabled = true;
    return;
  }
  downloadAllBtn.disabled = false;
  allMatches.forEach((m, i) => renderRow(m, i));
}

function printLinkFor(match){
  return "http://110.164.93.228/cert/export.php?module=certificate-export&type=print&id=" + match.printId;
}

const imageCache = new Map();
async function getCertImage(match){
  const key = match.printId;
  if(imageCache.has(key)) return imageCache.get(key);
  try{
    const html = await proxyFetch(printLinkFor(match));
    const img = extractCertImage(html);
    imageCache.set(key, img);
    return img;
  }catch(e){ return null; }
}

function renderRow(match, index){
  const tr = document.createElement("tr");
  tr.innerHTML =
    "<td>" + match.year + "</td>" +
    "<td>" + match.activity + "</td>" +
    "<td>" + match.name + "</td>" +
    "<td><a href=\"" + proxied(printLinkFor(match)) + "\" target=\"_blank\" rel=\"noopener\">ดู</a> " +
    "<button data-idx=\"" + index + "\">โหลด</button></td>";
  resultsBody.appendChild(tr);

  tr.querySelector("button").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "...";
    const img = await getCertImage(match);
    btn.disabled = false;
    btn.textContent = "โหลด";
    if(img) downloadDataUri(img.dataUri, sanitizeFilename(match.year + "_" + match.activity + "_" + match.printId) + "." + img.ext);
    else showErr("โหลดรูปไม่สำเร็จ: " + match.activity);
  });
}

function downloadDataUri(dataUri, filename){
  const a = document.createElement("a");
  a.href = dataUri;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

downloadAllBtn.addEventListener("click", async () => {
  downloadAllBtn.disabled = true;
  const originalText = downloadAllBtn.textContent;
  const zip = new JSZip();
  let done = 0;

  for(const match of allMatches){
    downloadAllBtn.textContent = "กำลังรวมไฟล์... " + done + "/" + allMatches.length;
    const img = await getCertImage(match);
    if(img){
      const filename = sanitizeFilename(match.year + "_" + match.activity + "_" + match.printId) + "." + img.ext;
      zip.file(filename, img.base64, { base64: true });
    }
    done++;
  }

  downloadAllBtn.textContent = "กำลังสร้าง ZIP...";
  const blob = await zip.generateAsync({ type: "blob" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "certificates.zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  downloadAllBtn.disabled = false;
  downloadAllBtn.textContent = originalText;
});
</script>
</body>
</html>
